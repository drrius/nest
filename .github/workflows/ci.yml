name: Nest checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:tooling
      - run: pnpm test:calendar
      - run: pnpm test:assistant
      - run: pnpm test:food
      - run: pnpm test:cooking
      - run: pnpm test:setup
      - run: pnpm test:routines
      - run: pnpm test:meals
      - run: pnpm test:notifications
      - run: pnpm test:memory
      - run: pnpm test:session
      - run: pnpm test:checklist
      - run: pnpm test:chores
      - run: pnpm test:offline
      - name: Test isolated PostgreSQL transactions and RLS
        run: NEST_TEST_PG_BIN="$(pg_config --bindir)" pnpm test:database
      - run: pnpm test
