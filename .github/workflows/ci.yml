name: Nest checks
on: [push, pull_request]
concurrency:
  group: nest-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Check pinned receipt Edge entry point
        run: deno check --frozen-lockfile --config supabase/functions/nest-receipt-upload/deno.json supabase/functions/nest-receipt-upload/index.ts
      - run: pnpm test:tooling
      - run: pnpm test:calendar
      - run: pnpm test:assistant
      - run: pnpm test:food
      - run: pnpm test:cooking
      - run: pnpm test:setup
      - run: pnpm test:routines
      - run: pnpm test:meals
      - run: pnpm test:money
      - run: pnpm test:notifications
      - run: pnpm test:memory
      - run: pnpm test:session
      - run: pnpm test:checklist
      - run: pnpm test:chores
      - run: pnpm test:offline
      - name: Install pinned PostgREST integration fixture
        shell: bash
        run: |
          set -euo pipefail
          fixture_dir="$RUNNER_TEMP/nest-postgrest"
          mkdir -p "$fixture_dir"
          curl --fail --location --retry 3 --output "$fixture_dir/postgrest.tar.xz" https://github.com/PostgREST/postgrest/releases/download/v16.3/postgrest-v16.3-linux-static-x86-64.tar.xz
          echo "4eb414eb948c8800863cc8c9896a17b611b2dccf9ff581f4d57f42ec9ccee40d  $fixture_dir/postgrest.tar.xz" | sha256sum --check --strict
          tar --extract --xz --file "$fixture_dir/postgrest.tar.xz" --directory "$fixture_dir" postgrest
          "$fixture_dir/postgrest" --version
      - name: Test core native HTTP and database journeys
        run: NEST_TEST_PG_BIN="$(pg_config --bindir)" NEST_TEST_POSTGREST_BIN="$RUNNER_TEMP/nest-postgrest/postgrest" pnpm test:integration:core
      - name: Test grocery reminder receipt isolation
        run: NEST_TEST_PG_BIN="$(pg_config --bindir)" NEST_TEST_POSTGREST_BIN="$RUNNER_TEMP/nest-postgrest/postgrest" node --test tests/integration/grocery-reminders.test.mjs
      - name: Test receipt access and retained financial history
        run: NEST_TEST_PG_BIN="$(pg_config --bindir)" NEST_TEST_POSTGREST_BIN="$RUNNER_TEMP/nest-postgrest/postgrest" node --test tests/integration/receipt-read-postgrest.test.mjs
      - name: Test planning preference privacy and setup
        run: |
          NEST_TEST_PG_BIN="$(pg_config --bindir)" NEST_TEST_POSTGREST_BIN="$RUNNER_TEMP/nest-postgrest/postgrest" node --test tests/integration/meal-planning-context-postgrest.test.mjs
          NEST_TEST_PG_BIN="$(pg_config --bindir)" NEST_TEST_POSTGREST_BIN="$RUNNER_TEMP/nest-postgrest/postgrest" node --test --test-name-pattern='unconfigured partner' tests/integration/meal-proposal-api-postgrest.test.mjs
      - name: Test retained attention date handling
        run: NEST_TEST_PG_BIN="$(pg_config --bindir)" node --test tests/database/legacy-attention-dates.test.mjs
      - name: Test migration writer privileges and reversible API fences
        run: NEST_TEST_PG_BIN="$(pg_config --bindir)" node --test tests/database/migration-writer-inventory.test.mjs tests/database/migration-api-fence.test.mjs tests/database/table-access-inventory.test.mjs
      - name: Test service-role write freeze
        run: NEST_TEST_PG_BIN="$(pg_config --bindir)" node --test --test-name-pattern='broad service-role' tests/database/cutover-write-barrier.test.mjs
      - name: Test retained routine schedule validation and history repair
        run: NEST_TEST_PG_BIN="$(pg_config --bindir)" node --test tests/database/routine-schedule-validation.test.mjs tests/database/routine-repair-history.test.mjs
      - name: Test complete append-only ledger events
        run: NEST_TEST_PG_BIN="$(pg_config --bindir)" node --test tests/database/complete-ledger-events.test.mjs
      - name: Test financial allocation consistency
        run: NEST_TEST_PG_BIN="$(pg_config --bindir)" node --test tests/database/financial-allocation-consistency.test.mjs
      - run: pnpm test
