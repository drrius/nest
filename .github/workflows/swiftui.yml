name: SwiftUI client checks
on:
  push:
    paths:
      - "apps/ios/**"
      - ".github/workflows/swiftui.yml"
      - "scripts/check-swift-limits.py"
  pull_request:
    paths:
      - "apps/ios/**"
      - ".github/workflows/swiftui.yml"
      - "scripts/check-swift-limits.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nest-swiftui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  swiftui:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify Swift source limits
        run: python3 scripts/check-swift-limits.py
      - name: Verify Swift formatting
        run: xcrun swift-format lint --strict --recursive --configuration apps/ios/.swift-format apps/ios/Nest apps/ios/Tests apps/ios/AppTests
      - name: Test Foundation domain and offline rules
        run: swift test --package-path apps/ios
      - name: Test iPhone session and account boundaries
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(device["udid"] for devices in data["devices"].values() for device in devices if device["name"].startswith("iPhone")))')
          xcodebuild -project apps/ios/Nest.xcodeproj -scheme Nest \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test
